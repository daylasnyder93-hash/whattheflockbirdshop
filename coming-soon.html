<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon | What The Flock Bird Shop</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            line-height: 1.6;
        }

        .home-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 120px;
            z-index: 9999;
            display: block;
        }

        .home-logo img {
            width: 100%;
            display: block;
        }

        .coming-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 100px 20px 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-title h1 {
            font-size: clamp(38px, 6vw, 55px);
            margin-bottom: 15px;
        }

        .page-title h1 span {
            color: #a8ff00;
        }

        .page-title p {
            color: #bbbbbb;
            font-size: 19px;
        }

        .coming-box {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 18px;
            padding: 60px 30px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto 50px;
        }

        .coming-box h2 {
            color: #a8ff00;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .coming-box p {
            color: #dddddd;
            font-size: 18px;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background: #a8ff00;
            color: #050505;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 17px;
        }

        @media (max-width: 700px) {
            .home-logo {
                width: 90px;
                top: 15px;
                left: 15px;
            }

            .coming-page {
                padding: 90px 15px 40px;
            }

            .coming-box {
                padding: 45px 20px;
            }
        }
    </style>
</head>

<body>

<a href="index.html" class="home-logo">
    <img src="image1-transparent.png" alt="What The Flock Bird Shop">
</a>

<main class="coming-page">

    <div class="page-title">
        <h1>
            Coming <span>Soon</span>
        </h1>

        <p>
            New birds will be joining our flock soon!
        </p>
    </div>

    <div class="coming-box">

        <h2>Stay Tuned!</h2>

        <p>
            We're always working on bringing new feathered friends
            to What The Flock Bird Shop.
        </p>

    </div>

    <div style="text-align:center;">

        <a href="index.html" class="back-button">
            Back to Home
        </a>

    </div>

</main>

</body>
</html>
