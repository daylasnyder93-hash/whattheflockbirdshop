<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="image1-transparent.png">

    <title>Pete | What The Flock Bird Shop</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
        }

        .home-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 120px;
            z-index: 9999;
            text-decoration: none;
        }

        .home-logo img {
            width: 100%;
            display: block;
        }

        .home-logo span {
            display: block;
            text-align: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: -10px;
        }

        .bird-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 20px 60px;
            text-align: center;
        }

        h1 {
            font-size: clamp(42px, 7vw, 65px);
            margin-bottom: 40px;
        }

        h1 span {
            color: #a8ff00;
        }

        .bird-card {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 40px;
            padding: 40px;
            overflow: hidden;
        }

        .bird-photo {
            width: 100%;
        }

        .bird-photo img {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            display: block;
            border-radius: 25px;
        }

        .bird-info {
            padding-top: 30px;
        }

        .bird-info h2 {
            color: #a8ff00;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .price {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 14px 28px;
            background: #a8ff00;
            color: #050505;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 17px;
        }

        @media (max-width: 600px) {

            .home-logo {
                width: 90px;
                top: 15px;
                left: 15px;
            }

            .bird-page {
                padding: 100px 15px 40px;
            }

            .bird-card {
                padding: 25px;
                border-radius: 30px;
            }

            .bird-info h2 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="home-logo">
        <img src="image1-transparent.png" alt="What The Flock Bird Shop">
        <span>Home</span>
    </a>

    <main class="bird-page">

        <h1><span>Pete</span></h1>

        <div class="bird-card">

            <div class="bird-photo">
                <img
                    src="birds/red-fronted-amazon.jpeg"
                    alt="Pete"
                >
            </div>

            <div class="bird-info">
                <h2>Pete</h2>
                <p class="price">Pending</p>
            </div>

        </div>

        <a href="birds.html" class="back-button">
            Back to Available Birds
        </a>

    </main>

</body>

</html>
