<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop Available Birds | What The Flock Bird Shop</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050505;
            color: #050505;
        }

        .birds-page {
            max-width: 700px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-title h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #a8ff00;
        }

        .page-title p {
            font-size: 18px;
        }

        .bird-listing {
            background: white;
            margin-bottom: 60px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0,0,0,0.12);
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .bird-photo {
            width: 100%;
            height: 350px;
            background: #eeeeee;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bird-photo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bird-info {
            padding: 30px;
            text-align: center;
        }

        .bird-info h2 {
            font-size: 36px;
            margin: 0 0 10px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }

        .bird-description {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .view-button {
            display: inline-block;
            background: #a8ff00;
            color: #000000;
            padding: 15px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        .contact-button {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            padding: 14px 28px;
            background: #a8ff00;
            color: #000000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
        }
.home-logo {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 120px;
    z-index: 9999;
    display: block;
    cursor: pointer;
    pointer-events: auto;
}

.home-logo img {
    width: 100%;
    display: block;
}
.home-logo span {
    display: block;
    text-align: center;
    color: white;
    font-size: 16px;
    font-weight: bold;
    margin-top: -10px;
    text-decoration: none;
}
    </style>

</head>
<a href="index.html" class="home-logo">
    <img src="image1-transparent.png" alt="What The Flock Bird Shop">
    <span>Home</span>
</a>
<body>

    <main class="birds-page">

        <div class="page-title">

            <h1>Shop Available Birds</h1>

            <p>
                Take a look at our currently available feathered friends.
            </p>

        </div>


        <!-- MITRED -->

        <section class="bird-listing">

            <div class="bird-photo">

                <img src="./IMG_5713.jpeg" alt="Mitred">

            </div>

            <div class="bird-info">

                <h2>Mitron Conure</h2>

                <p class="price">
                    Price Coming Soon
                </p>

                <a href="mitred.html" class="view-button">
                    View This Bird
                </a>

            </div>

        </section>


        <!-- RED-FRONTED AMAZON -->

        <section class="bird-listing">

            <div class="bird-photo">

                <img src="./amazon.jpg" alt="Red-Fronted Amazon">

            </div>

            <div class="bird-info">

                <h2>Red-Fronted Amazon</h2>

                <p class="price">
                    Price Coming Soon
                </p>

               

                <a href="amazon.html" class="view-button">
                    View This Bird
                </a>

            </div>

        </section>
<!-- SUN CONURES -->

<section class="bird-listing">

    <div class="bird-photo">
        <img src="./sleeping sun conures.jpeg" alt="Sun Conures">
    </div>

    <div class="bird-info">

        <h2>Sun Conures</h2>

        <p class="price">
            Price Coming Soon
        </p>

        <a href="sun-conures.html" class="view-button">
            View These Birds
        </a>

    </div>

</section>

        <a href="index.html#contact" class="contact-button">
            Contact Us
        </a>

    </main>

</body>

</html>
