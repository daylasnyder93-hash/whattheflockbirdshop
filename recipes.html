<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bird Care & Recipes | What The Flock Bird Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            line-height: 1.6;
        }

        .home-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 120px;
            z-index: 9999;
            text-decoration: none;
        }

        .home-logo img {
            width: 100%;
            display: block;
        }

        .home-logo span {
            display: block;
            text-align: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: -10px;
        }

        .recipes-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 20px 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-title h1 {
            font-size: clamp(38px, 6vw, 55px);
            margin-bottom: 15px;
        }

        .page-title h1 span {
            color: #a8ff00;
        }

        .page-title p {
            color: #bbbbbb;
            font-size: 19px;
        }

        .recipe-card {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 18px;
            padding: 35px;
            margin-bottom: 30px;
            text-align: center;
        }

        .recipe-card h2 {
            color: #a8ff00;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .recipe-card p {
            color: #dddddd;
            font-size: 18px;
        }
        .recipe-card a {
            color: #a8ff00;
            text-decoration: none;
        }
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #a8ff00;
            color: #050505;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 17px;
        }

        @media (max-width: 700px) {

            .home-logo {
                width: 90px;
                top: 15px;
                left: 15px;
            }

            .recipes-page {
                padding: 90px 15px 40px;
            }

            .recipe-card {
                padding: 25px 18px;
            }

        }

    </style>

</head>

<body>

    <a href="index.html" class="home-logo">
        <img src="image1-transparent.png" alt="What The Flock Bird Shop">
        <span>Home</span>
    </a>

    <main class="recipes-page">

        <div class="page-title">
            <h1>Bird Care <span>& Recipes</span></h1>
        </div>

      <div class="recipe-card">
    <a href="pellet.html">
        <h2>Pellet Recipe</h2>
    </a>
    <p>Recipe information coming soon.</p>
</div>

        <div class="recipe-card" id="chop">
            <h2>Chop Recipe</h2>
            <p>Recipe information coming soon.</p>
        </div>

        <div class="recipe-card" id="seed">
            <h2>Seed Recipe</h2>
            <p>Recipe information coming soon.</p>
        </div>

        <div style="text-align:center;">
            <a href="index.html" class="back-button">Back to Home</a>
        </div>

    </main>

</body>

</html>
