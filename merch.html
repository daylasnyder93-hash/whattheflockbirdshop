<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bird Merch | What The Flock Bird Shop</title>

    <style>

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 60px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 50px;
        }

        h1 span {
            color: #a8ff00;
        }

        .merch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .merch-card {
            display: block;
            background: #111111;
            border: 1px solid #333;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.2s;
        }

        .merch-card:hover {
            border-color: #a8ff00;
            transform: translateY(-3px);
        }

        .merch-card h2 {
            color: #a8ff00;
            margin-bottom: 15px;
        }

        .merch-card p {
            color: #ddd;
            font-size: 17px;
            line-height: 1.5;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 40px auto 0;
            padding: 12px 22px;
            background: #a8ff00;
            color: #050505;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .merch-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <main class="page">

        <h1>Bird <span>Merch</span></h1>

        <div class="merch-grid">

            <a href="pellet.html" class="merch-card">

                <h2>Pellet Recipe</h2>

                <p>
                    Our pellet recipe for your flock.
                </p>

            </a>

            <a href="chop.html" class="merch-card">

                <h2>Chop Recipe</h2>

                <p>
                    Our chop recipe for your flock.
                </p>

            </a>

            <a href="seed.html" class="merch-card">

                <h2>Seed Recipe</h2>

                <p>
                    Our seed recipe for your flock.
                </p>

            </a>

            <a href="toys.html" class="merch-card">

                <h2>Bird Toys</h2>

                <p>
                    Coming Soon
                </p>

            </a>

        </div>

        <a href="index.html" class="back-button">
            Back to Home
        </a>

    </main>

</body>

</html>
