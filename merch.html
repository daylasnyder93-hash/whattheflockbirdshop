<!DOCTYPE html>

<head>

    <title>Bird Merch | What The Flock Bird Shop</title>

    <style>

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 60px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 50px;
        }

        h1 span {
            color: #a8ff00;
        }

      .merch-grid {
    display: flex;
    flex-direction: column;
    gap: 25px;
}

        .merch-card {
            display: block;
            background: #111111;
            border: 1px solid #333;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.2s;
        }

        .merch-card:hover {
            border-color: #a8ff00;
            transform: translateY(-3px);
        }

        .merch-card h2 {
            color: #a8ff00;
            margin-bottom: 15px;
        }

        .merch-card p {
            color: #ddd;
            font-size: 17px;
            line-height: 1.5;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 40px auto 0;
            padding: 12px 22px;
            background: #a8ff00;
            color: #050505;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
        }

        @media (max-width: 600px) {

            .merch-grid {
                grid-template-columns: 1fr;
            }

        }
.home-link {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 120px
    z-index: 9999;
    text-decoration: none;
}

.home-link img {
    width: 100%;
    display: block;
}
.home-link span {
    display: block;
    text-align: center;
    color: white;
    font-size: 16px
    font-weight: bold;
    margin-top: -10px;
}

.home-link:hover {
    color: #a8ff00;
}

.merch-card {
    border-radius: 50px;
}
    </style>

</head>

            <a href="chop.html" class="merch-card">
