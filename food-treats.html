<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food & Treats | What The Flock Bird Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            line-height: 1.6;
        }

        /* =========================
           HOME BUTTON
        ========================= */

        .home-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 120px;
            z-index: 9999;
            text-decoration: none;
        }

        .home-logo img {
            width: 100%;
            display: block;
        }

        .home-logo span {
            display: block;
            text-align: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: -10px;
        }

        /* =========================
           PAGE
        ========================= */

        .food-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 110px 20px 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-title h1 {
            font-size: clamp(38px, 6vw, 55px);
        }

        .page-title h1 span {
            color: #a8ff00;
        }

        /* =========================
           PRODUCT GRID
        ========================= */

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* =========================
           PRODUCT CARDS
        ========================= */

        .product-card {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 40px;
            padding: 30px 30px 35px;
            min-height: 430px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;

            transition: 0.25s ease;
        }

        .product-card:hover {
            border-color: #a8ff00;
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            max-width: 260px;
            height: 220px;
            object-fit: contain;
            display: block;
            margin: 0 auto 20px;
        }

        .product-card h2 {
            color: #a8ff00;
            font-size: 30px;
            line-height: 1.3;
            margin: 0 0 12px;
        }

        .product-price {
            color: white;
            font-size: 27px;
            font-weight: bold;
        }

        .product-type {
            color: #a8ff00;
            font-size: 18px;
            font-weight: bold;
            margin-top: 6px;
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            display: block;
            width: fit-content;
            margin: 55px auto 0;
            padding: 15px 30px;

            background: #a8ff00;
            color: #050505;
            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            border-radius: 30px;
            transition: 0.25s ease;
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(168, 255, 0, 0.25);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .food-page {
                padding: 90px 18px 50px;
            }

            .home-logo {
                top: 15px;
                left: 15px;
                width: 90px;
            }

            .page-title h1 {
                font-size: 38px;
            }

            .product-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .product-card {
                min-height: 400px;
                padding: 30px 25px 35px;
            }

            .product-card img {
                max-width: 240px;
                height: 210px;
            }

            .product-card h2 {
                font-size: 27px;
            }

            .product-price {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

    <!-- HOME BUTTON -->

    <a href="index.html" class="home-logo">
        <img src="image1-transparent.png" alt="What The Flock Bird Shop">
        <span>Home</span>
    </a>


    <!-- PAGE -->

    <main class="food-page">

        <div class="page-title">
            <h1>Food <span>&amp; Treats</span></h1>
        </div>


        <!-- PRODUCT GRID -->

        <div class="product-grid">


            <!-- TWEETY POPS -->

            <div class="product-card">

                <img
                    src="toys/Tweety pops.png"
                    alt="Tweety Pops"
                >

                <h2>Tweety Pops</h2>

                <div class="product-price">
                    $6.99
                </div>

                <div class="product-type">
                    Treat
                </div>

            </div>


            <!-- TWEET EATS -->

            <div class="product-card">

                <img
                    src="toys/Tweet Eats.png"
                    alt="Tweet Eats"
                >

                <h2>Tweet Eats</h2>

                <div class="product-price">
                    $7.99
                </div>

                <div class="product-type">
                    Treat
                </div>

            </div>


        </div>


        <!-- BACK TO HOME -->

        <a href="index.html" class="back-button">
            Back to Home
        </a>

    </main>

</body>

</html>
