<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food & Treats | What The Flock Bird Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            line-height: 1.6;
        }

        .home-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 120px;
            z-index: 9999;
            text-decoration: none;
        }

        .home-logo img {
            width: 100%;
            display: block;
        }

        .home-logo span {
            display: block;
            text-align: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: -10px;
        }

        .food-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 110px 20px 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-title h1 {
            font-size: clamp(38px, 6vw, 55px);
        }

        .page-title h1 span {
            color: #a8ff00;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }

        .product-card {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 25px;
            padding: 45px 30px;
            text-align: center;
        }

        .product-card h2 {
            color: #a8ff00;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .product-card p {
            color: #dddddd;
            font-size: 18px;
        }

        .coming-soon {
            margin-top: 20px;
            color: #a8ff00 !important;
            font-size: 22px !important;
            font-weight: bold;
        }

        .back-button {
            display: inline-block;
            margin-top: 45px;
            padding: 14px 28px;
            background: #a8ff00;
            color: #050505;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 17px;
        }

        @media (max-width: 700px) {

            .home-logo {
                width: 90px;
                top: 15px;
                left: 15px;
            }

            .food-page {
                padding: 90px 15px 40px;
            }

            .product-card {
                padding: 35px 20px;
            }

        }

    </style>

</head>

<body>

    <a href="index.html" class="home-logo">
        <img src="image1-transparent.png" alt="What The Flock Bird Shop">
        <span>Home</span>
    </a>

    <main class="food-page">

        <div class="page-title">
            <h1>Food <span>&amp; Treats</span></h1>
        </div>

        <div class="product-grid">

            <div class="product-card">

                <h2>Food &amp; Treats</h2>

                <p>
                    We're getting our food and treat selection ready!
                </p>

                <p class="coming-soon">
                    Coming Soon
                </p>

            </div>

        </div>

        <div style="text-align:center;">
            <a href="index.html" class="back-button">
                Back to Home
            </a>
        </div>

    </main>

</body>

</html>
