<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chop Recipe | What The Flock Bird Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            line-height: 1.6;
        }

        .home-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 120px;
            z-index: 9999;
            text-decoration: none;
        }

        .home-logo img {
            width: 100%;
            display: block;
        }

        .home-logo span {
            display: block;
            text-align: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: -10px;
        }

        .recipe-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 110px 20px 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: clamp(38px, 6vw, 55px);
        }

        .page-title h1 span {
            color: #a8ff00;
        }

        .recipe-content {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 18px;
            padding: 40px;
        }

        .recipe-content h2 {
            color: #a8ff00;
            font-size: 32px;
            margin-bottom: 25px;
            text-align: center;
        }

        .ingredients {
            color: #dddddd;
            font-size: 19px;
            line-height: 2;
            text-align: center;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background: #a8ff00;
            color: #050505;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 17px;
        }

        @media (max-width: 700px) {

            .home-logo {
                width: 90px;
                top: 15px;
                left: 15px;
            }

            .recipe-page {
                padding: 90px 15px 40px;
            }

            .recipe-content {
                padding: 25px 18px;
            }

        }

    </style>

</head>

<body>

    <a href="index.html" class="home-logo">
        <img src="image1-transparent.png" alt="What The Flock Bird Shop">
        <span>Home</span>
    </a>

    <main class="recipe-page">

        <div class="page-title">
            <h1>Chop <span>Recipe</span></h1>
        </div>

        <div class="recipe-content">

            <h2>Ingredients</h2>

            <p class="ingredients">
                Beets<br>
                Kale<br>
                Mustard Greens<br>
                Carrots<br>
                Jalapeños<br>
                Squash<br>
                Zucchini<br>
                Red Bell Peppers<br>
                Yellow Bell Peppers<br>
                Orange Bell Peppers<br>
                Apple<br>
                Blueberries
            </p>

        </div>

        <div style="text-align:center;">
            <a href="merch.html" class="back-button">Back to Bird Merch</a>
        </div>
