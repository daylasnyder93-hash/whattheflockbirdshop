    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            line-height: 1.6;
        }

        /* =========================
           HEADER
        ========================= */

       header {
    background: #050505;
    border-bottom: 2px solid #a8ff00;
    padding: 12px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 1000;
    transition: transform 0.4s ease;
}

.header-logo {
    width: 165px;
}

.header-logo img {
    width: 100%;
    display: block;
}

.header-bird-logo {
    width: 145px;
}

.header-bird-logo img {
    width: 100%;
    display: block;
}

nav {
    display: flex;
    align-items: center;
    gap: 28px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: 0.2s;
}

nav a:hover {
    color: #a8ff00;
}
.dropdown {
    position: relative;
}

.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #050505;
    border: 1px solid #a8ff00;
    min-width: 190px;
    z-index: 1000;
}

.dropdown-content a {
    display: block;
    padding: 12px 15px;
    white-space: nowrap;
}

.dropdown:hover .dropdown-content {
    display: block;
}
        /* =========================
           GENERAL SECTIONS
        ========================= */

        section {
            padding: 85px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: clamp(32px, 5vw, 45px);
            text-transform: uppercase;
        }

        .section-title h2 span {
            color: #a8ff00;
        }

        .section-title p {
            color: #bbbbbb;
            margin-top: 12px;
            font-size: 18px;
        }

        /* =========================
           ABOUT
        ========================= */

        .about {
            background: #111111;
        }

            max-width: 850px;
            margin: auto;
            text-align: center;
        }

        .about-content p {
            color: #dddddd;
            font-size: 19px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        /* =========================
           BIRD SPECIES
        ========================= */

        .birds {
            background: #050505;
        }

        .bird-grid {
            max-width: 1100px;
            margin: auto;

            display: grid;
            justify-items: center;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
        }

        .bird-card {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 28px 20px;
            text-align: center;
            transition: 0.25s;
        }

        .bird-card:hover {
            border-color: #a8ff00;
            transform: translateY(-4px);
        }

        .bird-card h3 {
            color: #a8ff00;
            font-size: 20px;
        }

        .bird-card p {
            color: #aaaaaa;
            margin-top: 6px;
            font-size: 14px;
        }

        .more-birds {
            text-align: center;
            margin-top: 35px;
            color: #bbbbbb;
            font-size: 17px;
        }
/* =========================
   REVIEWS
========================= */

.reviews {
    max-width: 850px;
    margin: 0 auto 50px;
    text-align: center;
}

.review {
    display: block;
    opacity: 0;
    visibility: hidden;
    position: absolute;
    left: 0;
    right: 0;
    background: #050505;
    border: 1px solid #333333;
    border-radius: 15px;
    padding: 30px;
    transition: opacity 0.8s ease;
    text-decoration: none;
    color: inherit;
}

.review.active {
    opacity: 1;
    visibility: visible;
    position: relative;
}
.review:hover {
    cursor:pointer;
}
.stars {
    color: #a8ff00;
    font-size: 24px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.review p {
    color: #dddddd;
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 15px;
}

.review strong {
    color: white;
    font-size: 17px;
}
        /* =========================
           WHY US
        ========================= */

        .why-us {
            background: #101010;
        }

        .reasons {
            max-width: 1050px;
            margin: auto;

            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(230px, 1fr));

            gap: 30px;
        }

        .reason {
            text-align: center;
            padding: 25px;
        }

        .reason-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .reason h3 {
            color: #a8ff00;
            margin-bottom: 10px;
            font-size: 21px;
        }

        .reason p {
            color: #bbbbbb;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact {
            background: #a8ff00;
            color: #050505;
            text-align: center;
        }

        .contact h2 {
            font-size: clamp(32px, 5vw, 48px);
            margin-bottom: 15px;
        }

        .contact p {
            font-size: 19px;
            margin-bottom: 25px;
        }

        .contact-info {
            margin: 25px auto;
            font-size: 19px;
        }

        .contact-info a {
            color: #050505;
            font-weight: normal;
        }

        .contact-button {
            display: inline-block;
            background: #a8ff00;
            color: #000000;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px 
        }

========================= */

footer {

footer strong {

.social-links {

.contact-social-links a {

.contact-info p:last-child {

}
.social-links a {
    color: #050505;
    text-decoration: none;
    margin: 0 8px;
    font-weight: bold;
}
        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

    }

    }

    nav {

        flex-wrap: nowrap;
        justify-content: center;
    }

    nav a {
        font-size: 11px;
    }

    .hero p {
        font-size: 17px;
    }

    section {
        padding: 65px 5%;
    }
}

<script>

    let lastScrollY = window.scrollY;
    const header = document.querySelector("header");

    window.addEventListener("scroll", () => {

        if (window.scrollY > lastScrollY && window.scrollY > 100) {
            header.style.transform = "translateY(-100%)";
        } else {
            header.style.transform = "translateY(0)";
        }

        lastScrollY = window.scrollY;

    });
const reviews = document.querySelectorAll(".review");
let currentReview = 0;

setInterval(() => {

    reviews[currentReview].classList.remove("active");

    currentReview = (currentReview + 1) % reviews.length;

    reviews[currentReview].classList.add("active");

}, 15000);
</script>
