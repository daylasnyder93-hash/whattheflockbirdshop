<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clothing | What The Flock Bird Shop</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .clothing-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 20px 60px;
            text-align: center;
        }

        h1 {
            color: #a8ff00;
            font-size: 42px;
            margin-bottom: 50px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .product-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 30px;
            min-height: 430px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;
        }

        .product-card img {
            width: 100%;
            max-width: 300px;
            height: 260px;
            object-fit: contain;
            border-radius: 25px;
        }

        .product-card h2 {
            color: #a8ff00;
            font-size: 30px;
            margin: 25px 0 0;
        }

        .coming-soon {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .back-button {
            display: inline-block;
            margin-top: 50px;
            padding: 14px 25px;
            border: 1px solid #a8ff00;
            border-radius: 30px;
            color: #a8ff00;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            background: #a8ff00;
            color: #000;
        }

        @media (max-width: 800px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .product-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="clothing-page">

    <h1>Bird <span style="color:white;">Clothing</span></h1>

    <div class="product-grid">

        <div class="product-card">

            <img src="baby image.png" alt="Bird Clothing Coming Soon">

            <h2>Coming Soon</h2>

            <div class="coming-soon">
                Bird clothing is coming soon!
            </div>

        </div>

    </div>

    <a href="index.html" class="back-button">
        Back to Home
    </a>

</div>

</body>
</html>
