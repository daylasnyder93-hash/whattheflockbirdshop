<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clothing | What The Flock Bird Shop</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .clothing-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px 60px;
            text-align: center;
        }

        h1 {
            color: #a8ff00;
            font-size: 48px;
            margin-bottom: 50px;
        }

        .product-card {
            width: 100%;
            max-width: 850px;
            min-height: 650px;
            margin: 0 auto;

            background: #111;
            border: 1px solid #333;
            border-radius: 50px;

            padding: 50px;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .product-card img {
            width: 100%;
            max-width: 650px;
            height: 450px;
            object-fit: contain;
            border-radius: 30px;
        }

        .product-card h2 {
            color: #a8ff00;
            font-size: 42px;
            margin: 30px 0 10px;
        }

        .coming-soon {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .back-button {
            display: inline-block;
            margin-top: 50px;
            padding: 14px 25px;
            border: 1px solid #a8ff00;
            border-radius: 30px;
            color: #a8ff00;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            background: #a8ff00;
            color: #000;
        }

        @media (max-width: 600px) {
            .clothing-page {
                padding: 60px 15px 50px;
            }

            h1 {
                font-size: 38px;
            }

            .product-card {
                min-height: 550px;
                padding: 30px 20px;
                border-radius: 40px;
            }

            .product-card img {
                height: 350px;
            }

            .product-card h2 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="clothing-page">

    <h1>Bird <span style="color:white;">Clothing</span></h1>

    <div class="product-card">

        <img src="baby image.png" alt="Apparel Coming Soon">

        <h2>Coming Soon</h2>

        <div class="coming-soon">
            Bird clothing is coming soon!
        </div>

    </div>

    <a href="index.html" class="back-button">
        Back to Home
    </a>

</div>

</body>
</html>
